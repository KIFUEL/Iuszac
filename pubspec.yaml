name: law_app
description: Una aplicación web para la comunidad legal.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.0.0
  flutter_riverpod: ^2.5.0
  go_router: ^13.0.0
  google_fonts: ^6.0.0
  intl: ^0.20.2
  url_launcher: ^6.3.2
  flutter_quill: ^11.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: false
  ios: false
  image_path: "LuZac.png"
  web:
    generate: true
    image_path: "LuZac.png"
    background_color: "#1A237E"
    theme_color: "#1A237E"

flutter:
  uses-material-design: true
